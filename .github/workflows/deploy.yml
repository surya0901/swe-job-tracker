name: Collect jobs and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Targets roughly every 6 hours. GitHub Actions schedules are
    # best-effort, not an exact guarantee — the UI shows the real last-run
    # time, which is also published in collection-meta.json for the site.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Real collection against live Greenhouse/Lever/Ashby APIs. Writes
      # public/data/*.json. On a plain push (no schedule), this still runs
      # so a manual push doesn't ship stale data, but see the git-loop
      # guard below.
      - name: Collect job postings
        run: npm run collect

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Commit the freshly-collected dataset back to main so it's visible
      # in git history (collection history requirement) — but only on
      # schedule/manual runs, and with [skip ci] so this commit doesn't
      # re-trigger the push-based workflow run (avoiding an infinite
      # loop). The build+deploy below always happens in THIS SAME run
      # regardless, so deployment never depends on that commit triggering
      # another workflow.
      - name: Commit updated dataset
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --staged --quiet || git commit -m "chore: update collected job data [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
