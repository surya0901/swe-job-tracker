name: Collect jobs and deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Prevents the bot's own data commit (below) from re-triggering this
    # workflow — NOT used to skip committing data on a push run. A prior
    # version skipped the commit step on push triggers entirely, which
    # meant a push-triggered run's freshly collected data was deployed
    # live but never saved back to git — the next run would reconcile
    # against a stale snapshot and could lose firstSeenAt/closure history.
    # Every run now commits; only the commit's own push is prevented from
    # looping, via this paths-ignore.
    paths-ignore:
      - 'public/data/**'
  schedule:
    # Targets roughly every 6 hours. GitHub Actions schedules are
    # best-effort, not an exact guarantee — the UI shows the real last-run
    # time, which is also published in collection-meta.json for the site.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Real collection against live source APIs. Writes public/data/*.json,
      # reconciling against whatever is currently checked out in git (see
      # the commit step below for why that's now always kept current).
      - name: Collect job postings
        run: npm run collect

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Commit the freshly-collected dataset back to main on EVERY run
      # (push, schedule, or manual) so the next run's reconciliation
      # always starts from what's actually live, not a stale snapshot.
      # The `paths-ignore` on the push trigger above (not a conditional
      # here) is what prevents this commit from looping the workflow.
      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --staged --quiet || git commit -m "chore: update collected job data"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
